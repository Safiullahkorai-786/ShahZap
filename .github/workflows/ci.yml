name: ShahZap CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run build
